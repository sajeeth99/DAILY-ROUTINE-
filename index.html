<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyDay">
<link rel="manifest" href="manifest.json">

<title>MyDay</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
               "Segoe UI", sans-serif;
  background: #f3f4f6;
  color: #111827;
  padding-bottom: 85px;
}

body.dark {
  background: #111827;
  color: #f9fafb;
}

.app {
  max-width: 600px;
  margin: auto;
}

.header {
  padding: 25px 20px 15px;
  background: white;
  position: sticky;
  top: 0;
  z-index: 10;
}

.dark .header {
  background: #1f2937;
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 30px;
  font-weight: 800;
}

.date {
  color: #6b7280;
  font-size: 14px;
  margin-top: 4px;
}

.card {
  background: white;
  margin: 14px 16px;
  padding: 18px;
  border-radius: 20px;
  box-shadow: 0 4px 18px rgba(0,0,0,.05);
}

.dark .card {
  background: #1f2937;
}

.progress-number {
  font-size: 34px;
  font-weight: 800;
}

.progress-bar {
  height: 9px;
  background: #e5e7eb;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 12px;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: #2563eb;
  transition: .3s;
}

.stats {
  display: flex;
  justify-content: space-between;
  margin-top: 15px;
  font-size: 13px;
}

.task {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 15px 0;
  border-bottom: 1px solid #e5e7eb;
}

.dark .task {
  border-color: #374151;
}

.task:last-child {
  border-bottom: none;
}

.task-info {
  flex: 1;
}

.task-name {
  font-weight: 700;
  font-size: 16px;
}

.task-time {
  font-size: 12px;
  color: #6b7280;
  margin-top: 4px;
}

.status-buttons {
  display: flex;
  gap: 5px;
}

.status-btn {
  border: none;
  padding: 7px 9px;
  border-radius: 9px;
  font-size: 12px;
  cursor: pointer;
}

.pending {
  background: #f3f4f6;
}

.done {
  background: #dcfce7;
  color: #166534;
}

.didnt {
  background: #fee2e2;
  color: #991b1b;
}

.dark .pending {
  background: #374151;
  color: white;
}

.add-btn {
  width: calc(100% - 32px);
  margin: 8px 16px;
  padding: 15px;
  border: none;
  border-radius: 16px;
  background: #2563eb;
  color: white;
  font-size: 16px;
  font-weight: 700;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 72px;
  background: rgba(255,255,255,.95);
  backdrop-filter: blur(15px);
  display: flex;
  justify-content: space-around;
  align-items: center;
  border-top: 1px solid #ddd;
  z-index: 100;
}

.dark .bottom-nav {
  background: rgba(31,41,55,.95);
  border-color: #374151;
}

.nav-btn {
  background: none;
  border: none;
  font-size: 11px;
  color: #6b7280;
}

.nav-btn.active {
  color: #2563eb;
  font-weight: 700;
}

.nav-icon {
  display: block;
  font-size: 22px;
  margin-bottom: 2px;
}

.section {
  display: none;
}

.section.active {
  display: block;
}

.big-stat {
  text-align: center;
  padding: 15px;
}

.big-stat-number {
  font-size: 38px;
  font-weight: 800;
}

.row {
  display: flex;
  justify-content: space-between;
  padding: 13px 0;
  border-bottom: 1px solid #e5e7eb;
}

.dark .row {
  border-color: #374151;
}

button {
  font-family: inherit;
}

.icon-btn {
  border: none;
  background: #f3f4f6;
  border-radius: 12px;
  padding: 9px;
  font-size: 18px;
}

.dark .icon-btn {
  background: #374151;
  color: white;
}

input {
  width: 100%;
  padding: 13px;
  border-radius: 12px;
  border: 1px solid #d1d5db;
  margin-top: 7px;
  margin-bottom: 14px;
  font-size: 16px;
  background: white;
}

.dark input {
  background: #374151;
  color: white;
  border-color: #4b5563;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 200;
  align-items: flex-end;
}

.modal.show {
  display: flex;
}

.modal-box {
  width: 100%;
  max-width: 600px;
  margin: auto;
  background: white;
  border-radius: 25px 25px 0 0;
  padding: 25px;
}

.dark .modal-box {
  background: #1f2937;
}

.modal-title {
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 20px;
}

.save-btn {
  width: 100%;
  border: none;
  background: #2563eb;
  color: white;
  padding: 15px;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 700;
}

.cancel-btn {
  width: 100%;
  border: none;
  background: #e5e7eb;
  padding: 14px;
  border-radius: 14px;
  margin-top: 8px;
}

.dark .cancel-btn {
  background: #374151;
  color: white;
}

.empty {
  text-align: center;
  color: #6b7280;
  padding: 25px;
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="header-top">
    <div>
      <div class="logo">MyDay</div>
      <div class="date" id="todayDate"></div>
    </div>

    <button class="icon-btn" onclick="toggleDark()">🌙</button>
  </div>
</header>


<!-- TODAY -->

<section id="today" class="section active">

  <div class="card">

    <div class="progress-number" id="progressText">0%</div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="stats">
      <span>✅ Done: <b id="doneCount">0</b></span>
      <span>❌ Didn't: <b id="didntCount">0</b></span>
      <span>⏳ Pending: <b id="pendingCount">0</b></span>
    </div>

  </div>

  <div class="card">
    <h3>Today's Tasks</h3>
    <div id="taskList"></div>
  </div>

  <button class="add-btn" onclick="openModal()">
    ＋ Add Routine
  </button>

</section>


<!-- WEEK -->

<section id="week" class="section">

  <div class="card">

    <h2>📊 This Week</h2>

    <div class="big-stat">
      <div class="big-stat-number" id="weekPercent">0%</div>
      <div>Weekly Performance</div>
    </div>

    <div id="weekDetails"></div>

  </div>

</section>


<!-- MONTH -->

<section id="month" class="section">

  <div class="card">

    <h2>📈 This Month</h2>

    <div class="big-stat">
      <div class="big-stat-number" id="monthPercent">0%</div>
      <div>Monthly Performance</div>
    </div>

    <div class="row">
      <span>✅ Completed</span>
      <b id="monthDone">0</b>
    </div>

    <div class="row">
      <span>❌ Didn't</span>
      <b id="monthDidnt">0</b>
    </div>

    <div class="row">
      <span>🔥 Current Streak</span>
      <b id="streak">0 days</b>
    </div>

  </div>

</section>


<!-- HISTORY -->

<section id="history" class="section">

  <div class="card">

    <h2>📅 History</h2>

    <div id="historyList"></div>

  </div>

</section>


<!-- SETTINGS -->

<section id="settings" class="section">

  <div class="card">

    <h2>⚙️ Settings</h2>

    <div class="row">
      <span>🔔 Notifications</span>
      <button class="icon-btn" onclick="requestNotifications()">Enable</button>
    </div>

    <div class="row">
      <span>📲 App Version</span>
      <b>3.0</b>
    </div>

    <div class="row">
      <span>💾 Data</span>
      <button class="icon-btn" onclick="exportData()">Export</button>
    </div>

    <div class="row">
      <span>🗑️ Reset</span>
      <button class="icon-btn" onclick="resetData()">Reset</button>
    </div>

  </div>

</section>


<!-- NAVIGATION -->

<nav class="bottom-nav">

  <button class="nav-btn active" onclick="showPage('today',this)">
    <span class="nav-icon">☀️</span>
    Today
  </button>

  <button class="nav-btn" onclick="showPage('week',this)">
    <span class="nav-icon">📊</span>
    Week
  </button>

  <button class="nav-btn" onclick="showPage('month',this)">
    <span class="nav-icon">📈</span>
    Month
  </button>

  <button class="nav-btn" onclick="showPage('history',this)">
    <span class="nav-icon">📅</span>
    History
  </button>

  <button class="nav-btn" onclick="showPage('settings',this)">
    <span class="nav-icon">⚙️</span>
    Settings
  </button>

</nav>

</div>


<!-- ADD ROUTINE MODAL -->

<div class="modal" id="modal">

  <div class="modal-box">

    <div class="modal-title">Add Routine</div>

    <label>Routine name</label>
    <input id="routineName" placeholder="Example: Reading">

    <label>Time</label>
    <input id="routineTime" type="time">

    <button class="save-btn" onclick="addRoutine()">
      Add Routine
    </button>

    <button class="cancel-btn" onclick="closeModal()">
      Cancel
    </button>

  </div>

</div>


<script>

const defaultRoutines = [
  {id:1,name:"Fajr Prayer",time:"05:00"},
  {id:2,name:"Quran",time:"05:30"},
  {id:3,name:"Duas",time:"06:00"},
  {id:4,name:"Dhikr",time:"06:15"},
  {id:5,name:"Work / Career",time:"08:00"},
  {id:6,name:"Study / Learning",time:"20:00"},
  {id:7,name:"Gym / Exercise",time:"19:00"},
  {id:8,name:"Other Important Task",time:"21:00"}
];

let routines =
  JSON.parse(localStorage.getItem("myday_routines")) ||
  defaultRoutines;

let records =
  JSON.parse(localStorage.getItem("myday_records")) || {};

function todayKey() {
  const d = new Date();

  return d.getFullYear() + "-" +
    String(d.getMonth()+1).padStart(2,"0") + "-" +
    String(d.getDate()).padStart(2,"0");
}

function save() {
  localStorage.setItem(
    "myday_routines",
    JSON.stringify(routines)
  );

  localStorage.setItem(
    "myday_records",
    JSON.stringify(records)
  );
}

function getTodayRecords() {

  const key = todayKey();

  if (!records[key]) {
    records[key] = {};
  }

  return records[key];
}

function setStatus(id,status) {

  const day = getTodayRecords();

  day[id] = status;

  save();

  render();
}

function render() {

  renderTasks();
  updateTodayStats();
  updateWeek();
  updateMonth();
  updateHistory();
}

function renderTasks() {

  const container =
    document.getElementById("taskList");

  const day = getTodayRecords();

  if (routines.length === 0) {
    container.innerHTML =
      '<div class="empty">No routines yet.</div>';
    return;
  }

  container.innerHTML = routines.map(r => {

    const status = day[r.id] || "pending";

    return `
      <div class="task">

        <div class="task-info">
          <div class="task-name">${escapeHTML(r.name)}</div>
          <div class="task-time">⏰ ${r.time}</div>
        </div>

        <div class="status-buttons">

          <button
            class="status-btn ${status === "done" ? "done" : "pending"}"
            onclick="setStatus(${r.id},'done')">
            ✓
          </button>

          <button
            class="status-btn ${status === "didnt" ? "didnt" : "pending"}"
            onclick="setStatus(${r.id},'didnt')">
            ✕
          </button>

        </div>

      </div>
    `;

  }).join("");
}

function updateTodayStats() {

  const day = getTodayRecords();

  let done = 0;
  let didnt = 0;

  routines.forEach(r => {

    if (day[r.id] === "done") done++;

    if (day[r.id] === "didnt") didnt++;

  });

  const total = routines.length;

  const pending =
    Math.max(total - done - didnt,0);

  const percent =
    total === 0
      ? 0
      : Math.round((done / total) * 100);

  document.getElementById("progressText")
    .textContent = percent + "%";

  document.getElementById("progressFill")
    .style.width = percent + "%";

  document.getElementById("doneCount")
    .textContent = done;

  document.getElementById("didntCount")
    .textContent = didnt;

  document.getElementById("pendingCount")
    .textContent = pending;
}

function getDateKey(date) {

  return date.getFullYear() + "-" +
    String(date.getMonth()+1).padStart(2,"0") + "-" +
    String(date.getDate()).padStart(2,"0");
}

function updateWeek() {

  let done = 0;
  let total = 0;

  for (let i=0;i<7;i++) {

    const d = new Date();

    d.setDate(d.getDate()-i);

    const key = getDateKey(d);

    const day = records[key] || {};

    routines.forEach(r => {

      total++;

      if (day[r.id] === "done") {
        done++;
      }

    });

  }

  const percent =
    total === 0 ? 0 :
    Math.round((done/total)*100);

  document.getElementById("weekPercent")
    .textContent = percent + "%";

  document.getElementById("weekDetails")
    .innerHTML =
      `<div class="row">
        <span>Completed</span>
        <b>${done}</b>
      </div>
      <div class="row">
        <span>Total tasks</span>
        <b>${total}</b>
      </div>`;
}

function updateMonth() {

  const now = new Date();

  let done = 0;
  let didnt = 0;

  const days =
    new Date(
      now.getFullYear(),
      now.getMonth()+1,
      0
    ).getDate();

  for (let i=1;i<=days;i++) {

    const d = new Date(
      now.getFullYear(),
      now.getMonth(),
      i
    );

    const key = getDateKey(d);

    const day = records[key] || {};

    routines.forEach(r => {

      if (day[r.id] === "done") done++;

      if (day[r.id] === "didnt") didnt++;

    });

  }

  const total = days * routines.length;

  const percent =
    total === 0 ? 0 :
    Math.round((done/total)*100);

  document.getElementById("monthPercent")
    .textContent = percent + "%";

  document.getElementById("monthDone")
    .textContent = done;

  document.getElementById("monthDidnt")
    .textContent = didnt;

  calculateStreak();
}

function calculateStreak() {

  let streak = 0;

  for (let i=0;i<365;i++) {

    const d = new Date();

    d.setDate(d.getDate()-i);

    const key = getDateKey(d);

    const day = records[key] || {};

    const completed =
      routines.length > 0 &&
      routines.every(r =>
        day[r.id] === "done"
      );

    if (completed) {
      streak++;
    } else {
      break;
    }

  }

  document.getElementById("streak")
    .textContent = streak + " days";
}

function updateHistory() {

  const container =
    document.getElementById("historyList");

  const keys =
    Object.keys(records).sort().reverse();

  if (keys.length === 0) {

    container.innerHTML =
      '<div class="empty">No history yet.</div>';

    return;
  }

  container.innerHTML =
    keys.slice(0,30).map(key => {

      const day = records[key];

      let done = 0;
      let didnt = 0;

      routines.forEach(r => {

        if(day[r.id] === "done") done++;

        if(day[r.id] === "didnt") didnt++;

      });

      return `
        <div class="row">

          <span>
            📅 ${key}
          </span>

          <span>
            ✅ ${done}
            &nbsp;
            ❌ ${didnt}
          </span>

        </div>
      `;

    }).join("");
}

function showPage(page,button) {

  document
    .querySelectorAll(".section")
    .forEach(s =>
      s.classList.remove("active")
    );

  document
    .getElementById(page)
    .classList.add("active");

  document
    .querySelectorAll(".nav-btn")
    .forEach(b =>
      b.classList.remove("active")
    );

  button.classList.add("active");

  window.scrollTo(0,0);
}

function openModal() {

  document
    .getElementById("modal")
    .classList.add("show");
}

function closeModal() {

  document
    .getElementById("modal")
    .classList.remove("show");
}

function addRoutine() {

  const name =
    document.getElementById("routineName")
      .value.trim();

  const time =
    document.getElementById("routineTime")
      .value;

  if (!name) {

    alert("Please enter a routine name.");

    return;
  }

  const routine = {

    id: Date.now(),

    name:name,

    time:time || "00:00"

  };

  routines.push(routine);

  save();

  document.getElementById("routineName")
    .value = "";

  document.getElementById("routineTime")
    .value = "";

  closeModal();

  render();
}

function toggleDark() {

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "myday_dark",
    document.body.classList.contains("dark")
  );

}

function requestNotifications() {

  if (!("Notification" in window)) {

    alert(
      "Notifications are not supported by this browser."
    );

    return;
  }

  Notification.requestPermission()
    .then(permission => {

      if(permission === "granted") {

        new Notification("MyDay", {
          body:"Notifications are enabled!"
        });

      }

    });

}

function exportData() {

  const data = {

    routines:routines,

    records:records

  };

  const blob =
    new Blob(
      [JSON.stringify(data,null,2)],
      {type:"application/json"}
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "MyDay-backup.json";

  a.click();

  URL.revokeObjectURL(url);
}

function resetData() {

  if(
    confirm(
      "Delete all MyDay progress?"
    )
  ) {

    localStorage.removeItem("myday_records");

    location.reload();

  }

}

function escapeHTML(text) {

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

document.getElementById("todayDate")
  .textContent =
  new Date().toLocaleDateString(
    undefined,
    {
      weekday:"long",
      day:"numeric",
      month:"long"
    }
  );

if(
  localStorage.getItem("myday_dark") === "true"
) {
  document.body.classList.add("dark");
}

if ("serviceWorker" in navigator) {

  window.addEventListener("load", () => {

    navigator.serviceWorker
      .register("sw.js")
      .catch(() => {});

  });

}

render();

</script>

</body>
</html>
